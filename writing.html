<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>게시판 | 글쓰기</title>
</head>
<body>
     <!--공통 상단-->
    <header> 
        <div class="logo"><a href="index.html">JAEHYEONG COMPANY</a>
        </div>
        <nav>
            <a href="index.html">홈</a>
            <a href="#">회사소개</a>
            <a href="#">제품소개</a>
            <a href="board.html">게시판</a>
        </nav>
    </header>

    <!--게시판 목록-->
    <main>
        <section class="page-title">
            <h1>게시판</h1>
            <p>JAEHYEONG PHARMA의 새로운 소식을 확인하세요</p>
        </section>

        <!--게시판 글쓰기-->
        <section class="content-section form">
            <h2>글쓰기</h2>
            <form>
                <label>제목</label>
                <input type="text" id="title" placeholder="제목을 입력하세요">

                <label>작성자</label>
                <input type="text" id="writer" placeholder="작성자를 입력하세요">

                <label>내용</label>
                <textarea id="content" placeholder="내용을 입력하세요" rows="10"></textarea>
            </form>

            <div class="form-buttons">
                <button type="submit" class="button">등록하기</button>
                <a href="board.html" class="button gray">취소하기</a>
            </div>
        </section>
    </main>

    <!--공통 하단-->
    <footer>
        <p>JAEHYEONG PHARMA</p>
        <p>주소: 서울특별시 건강로 123 | 대표번호:02-1234-5678</p>
        <small>Copyright 2026 JAEHYEONG PHARMA All right reserved</small>
    </footer>
</body>
</html>
